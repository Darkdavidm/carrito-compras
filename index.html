<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Web - Carrito y Usuarios</title>
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
    <header>
        <div class="brand">
            <h1>Mi Tienda Web</h1>
        </div>

        <div id="user-header-info" class="user-header-info oculto">
            <div class="user-text">
                <span class="user-saludo">Bienvenido(a), <strong id="user-name"></strong></span>
                <span class="user-datos" id="user-datos"></span>
            </div>
            <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
        </div>

        <div class="header-acciones">
            <button id="btn-theme">Modo Oscuro</button>
        </div>
    </header>

    <section id="seccion-auth" class="auth-container">
        <div class="auth-card">
            <h2>Acceso a la Tienda</h2>

            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn activo" type="button">Iniciar Sesión</button>
                <button id="tab-registro" class="tab-btn" type="button">Registrarse</button>
            </div>

            <!-- Formulario de Inicio de Sesión con validación personalizada en JS -->
            <form id="form-login" class="auth-form" novalidate>
                <div class="demo-box">
                    <p><strong>👥 Usuarios Demo del Equipo:</strong></p>
                    <p>Clave demo: <code>Demo12345</code></p>
                    <div class="demo-botones">
                        <button type="button" id="btn-autofill-jesus" class="btn-demo">Usar cuenta de Jesús Contreras</button>
                        <button type="button" id="btn-autofill-lysney" class="btn-demo btn-demo-alt">Usar cuenta de Lysney Simancas</button>
                    </div>
                </div>

                <div class="form-grupo">
                    <label for="login-email">Correo Electrónico:</label>
                    <input type="email" id="login-email" placeholder="Ej. jdcontrerast@gmail.com">
                    <small class="error" id="error-login-email"></small>
                </div>
                <div class="form-grupo">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" placeholder="Ingresa tu contraseña">
                    <small class="error" id="error-login-password"></small>
                </div>
                <button type="submit" class="btn-primary">Ingresar a la Tienda</button>
            </form>

            <!-- Formulario de Registro de Clientes con validación JS y expresiones regulares -->
            <form id="form-registro" class="auth-form oculto" novalidate>
                <div class="form-grupo">
                    <label for="reg-nombre">Nombre Completo:</label>
                    <input type="text" id="reg-nombre" placeholder="Ej. Lysney Simancas Segovia">
                    <small class="error" id="error-reg-nombre"></small>
                </div>
                <div class="form-grupo">
                    <label for="reg-telefono">Teléfono / Celular (10 dígitos):</label>
                    <input type="tel" id="reg-telefono" placeholder="Ej. 3028348399">
                    <small class="error" id="error-reg-telefono"></small>
                </div>
                <div class="form-grupo">
                    <label for="reg-direccion">Dirección de Envío:</label>
                    <input type="text" id="reg-direccion" placeholder="Ej. Calle 45 # 12-30">
                    <small class="error" id="error-reg-direccion"></small>
                </div>
                <div class="form-grupo">
                    <label for="reg-email">Correo Electrónico:</label>
                    <input type="email" id="reg-email" placeholder="Ej. usuario@correo.com">
                    <small class="error" id="error-reg-email"></small>
                </div>
                <div class="form-grupo">
                    <label for="reg-password">Contraseña (mínimo 8 caracteres):</label>
                    <input type="password" id="reg-password" placeholder="Mínimo 8 caracteres">
                    <small class="error" id="error-reg-password"></small>
                </div>
                <div class="form-grupo">
                    <label for="reg-confirmar">Confirmar Contraseña:</label>
                    <input type="password" id="reg-confirmar" placeholder="Repite tu contraseña">
                    <small class="error" id="error-reg-confirmar"></small>
                </div>
                <button type="submit" class="btn-primary">Crear Cuenta y Registrarse</button>
            </form>

            <p id="auth-mensaje"></p>
        </div>
    </section>

    <main id="seccion-tienda" class="oculto">
        <section class="productos">
            <h2>Productos Disponibles</h2>
            <div class="grid-productos">
                <div class="producto">
                    <h3>Producto A</h3>
                    <p>Precio: $10</p>
                    <button class="btn-agregar" data-id="1" data-nombre="Producto A" data-precio="10">Agregar al Carrito</button>
                </div>
                <div class="producto">
                    <h3>Producto B</h3>
                    <p>Precio: $20</p>
                    <button class="btn-agregar" data-id="2" data-nombre="Producto B" data-precio="20">Agregar al Carrito</button>
                </div>
                <div class="producto">
                    <h3>Producto C</h3>
                    <p>Precio: $30</p>
                    <button class="btn-agregar" data-id="3" data-nombre="Producto C" data-precio="30">Agregar al Carrito</button>
                </div>
            </div>
        </section>

        <section class="carrito">
            <h2>Mi Carrito</h2>
            <div id="lista-carrito">
            </div>
            <div class="carrito-footer">
                <p>Total: $<span id="total-carrito">0</span></p>
                <button id="btn-vaciar">Vaciar Carrito</button>
            </div>
        </section>
    </main>

    <script src="js/app.js?v=4"></script>
</body>
</html>
