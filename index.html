<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras y Registro de Clientes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Mi Tienda Web</h1>
        <button id="btn-theme">Modo Oscuro</button>
    </header>

    <main>
        <!-- Módulo de Registro de Clientes / Usuarios -->
        <section class="registro-seccion">
            <h2>Registro de Clientes</h2>
            <form id="form-registro">
                <div class="form-grupo">
                    <label for="reg-nombre">Nombre Completo:</label>
                    <input type="text" id="reg-nombre" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="form-grupo">
                    <label for="reg-email">Correo Electrónico:</label>
                    <input type="email" id="reg-email" placeholder="Ej. juan@correo.com" required>
                </div>
                <div class="form-grupo">
                    <label for="reg-telefono">Teléfono / Celular:</label>
                    <input type="tel" id="reg-telefono" placeholder="Ej. 3001234567" required>
                </div>
                <div class="form-grupo">
                    <label for="reg-direccion">Dirección:</label>
                    <input type="text" id="reg-direccion" placeholder="Ej. Calle 10 # 20 - 30" required>
                </div>
                <button type="submit" id="btn-registrar">Registrar Cliente</button>
            </form>
            <div id="mensaje-registro"></div>

            <h3>Clientes Registrados</h3>
            <div id="lista-clientes">
                <!-- Se renderizan los clientes dinámicamente con JS -->
            </div>
        </section>

        <!-- Módulo de Productos -->
        <section class="productos">
            <h2>Productos</h2>
            <div class="grid-productos">
                <!-- Producto 1 -->
                <div class="producto">
                    <h3>Producto A</h3>
                    <p>Precio: $10</p>
                    <button class="btn-agregar" data-id="1" data-nombre="Producto A" data-precio="10">Agregar al Carrito</button>
                </div>
                <!-- Producto 2 -->
                <div class="producto">
                    <h3>Producto B</h3>
                    <p>Precio: $20</p>
                    <button class="btn-agregar" data-id="2" data-nombre="Producto B" data-precio="20">Agregar al Carrito</button>
                </div>
                <!-- Producto 3 -->
                <div class="producto">
                    <h3>Producto C</h3>
                    <p>Precio: $30</p>
                    <button class="btn-agregar" data-id="3" data-nombre="Producto C" data-precio="30">Agregar al Carrito</button>
                </div>
            </div>
        </section>

        <!-- Módulo de Carrito de Compras -->
        <section class="carrito">
            <h2>Carrito de Compras</h2>
            <div id="lista-carrito">                
            </div>
            <div class="carrito-footer">
                <p>Total: $<span id="total-carrito">0</span></p>
                <button id="btn-vaciar">Vaciar Carrito</button>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
