<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Web - Carrito y Usuarios</title>
    <!-- Parámetro de versión para evitar caché en navegadores -->
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <header>
        <div class="brand">
            <h1>Mi Tienda Web</h1>
        </div>
        
        <!-- Información del usuario logueado -->
        <div id="user-header-info" class="user-header-info oculto">
            <div class="user-text">
                <span class="user-saludo">Bienvenido, <strong id="user-name"></strong></span>
                <span class="user-datos" id="user-datos"></span>
            </div>
            <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
        </div>

        <div class="header-acciones">
            <button id="btn-theme">Modo Oscuro</button>
        </div>
    </header>

    <!-- ==============================================
         PANTALLA DE ACCESO (LOGIN Y REGISTRO)
         ============================================== -->
    <section id="seccion-auth" class="auth-container">
        <div class="auth-card">
            <h2>Acceso a la Tienda</h2>
            
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn activo">Iniciar Sesión</button>
                <button id="tab-registro" class="tab-btn">Registrarse</button>
            </div>

            <!-- Formulario de Iniciar Sesión -->
            <form id="form-login" class="auth-form">
                <div class="demo-box">
                    <p><strong>👤 Usuario Demo Registrado:</strong></p>
                    <p>Email: <code>jdcontrerast@gmail.com</code> | Clave: <code>123</code></p>
                    <button type="button" id="btn-autofill" class="btn-demo">Rellenar datos de Jesús Contreras</button>
                </div>

                <div class="form-grupo">
                    <label for="login-email">Correo Electrónico:</label>
                    <input type="email" id="login-email" placeholder="Ej. jdcontrerast@gmail.com" required>
                </div>
                <div class="form-grupo">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" placeholder="Ej. 123" required>
                </div>
                <button type="submit" class="btn-primary">Ingresar a la Tienda</button>
            </form>

            <!-- Formulario de Registro de Usuario / Cliente -->
            <form id="form-registro" class="auth-form oculto">
                <div class="form-grupo">
                    <label for="reg-nombre">Nombre Completo:</label>
                    <input type="text" id="reg-nombre" placeholder="Ej. Jesús Contreras" required>
                </div>
                <div class="form-grupo">
                    <label for="reg-telefono">Teléfono / Celular:</label>
                    <input type="tel" id="reg-telefono" placeholder="Ej. 3028348399" required>
                </div>
                <div class="form-grupo">
                    <label for="reg-direccion">Dirección:</label>
                    <input type="text" id="reg-direccion" placeholder="Ej. Avenida falsa 123" required>
                </div>
                <div class="form-grupo">
                    <label for="reg-email">Correo Electrónico:</label>
                    <input type="email" id="reg-email" placeholder="Ej. jdcontrerast@gmail.com" required>
                </div>
                <div class="form-grupo">
                    <label for="reg-password">Contraseña:</label>
                    <input type="password" id="reg-password" placeholder="Ej. 123" required>
                </div>
                <button type="submit" class="btn-primary">Crear Cuenta y Registrarse</button>
            </form>

            <div id="auth-mensaje"></div>
        </div>
    </section>

    <!-- ==============================================
         PANTALLA PRINCIPAL DE LA TIENDA (Solo con sesión)
         ============================================== -->
    <main id="seccion-tienda" class="oculto">
        <!-- Catálogo de Productos -->
        <section class="productos">
            <h2>Productos Disponibles</h2>
            <div class="grid-productos">
                <div class="producto">
                    <h3>Producto A</h3>
                    <p>Precio: $10</p>
                    <button class="btn-agregar" data-id="1" data-nombre="Producto A" data-precio="10">Agregar al Carrito</button>
                </div>
                <div class="producto">
                    <h3>Producto B</h3>
                    <p>Precio: $20</p>
                    <button class="btn-agregar" data-id="2" data-nombre="Producto B" data-precio="20">Agregar al Carrito</button>
                </div>
                <div class="producto">
                    <h3>Producto C</h3>
                    <p>Precio: $30</p>
                    <button class="btn-agregar" data-id="3" data-nombre="Producto C" data-precio="30">Agregar al Carrito</button>
                </div>
            </div>
        </section>

        <!-- Carrito de Compras Personalizado -->
        <section class="carrito">
            <h2>Mi Carrito</h2>
            <div id="lista-carrito">
                <!-- Se renderizan los productos de este usuario -->
            </div>
            <div class="carrito-footer">
                <p>Total: $<span id="total-carrito">0</span></p>
                <button id="btn-vaciar">Vaciar Carrito</button>
            </div>
        </section>
    </main>

    <script src="js/app.js?v=3"></script>
</body>
</html>
