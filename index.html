<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Web - Carrito y Usuarios</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Mi Tienda Web</h1>
        <div class="header-acciones">
            <span id="user-info" class="oculto">Hola, <strong id="user-name"></strong> 👋</span>
            <button id="btn-theme">Modo Oscuro</button>
            <button id="btn-logout" class="oculto">Cerrar Sesión</button>
        </div>
    </header>

    <!-- ==============================================
         PANTALLA DE ACCESO (LOGIN Y REGISTRO)
         ============================================== -->
    <section id="seccion-auth" class="auth-container">
        <div class="auth-card">
            <h2>Acceso a la Tienda</h2>
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn activo">Iniciar Sesión</button>
                <button id="tab-registro" class="tab-btn">Registrarse</button>
            </div>

            <!-- Formulario de Iniciar Sesión -->
            <form id="form-login" class="auth-form">
                <div class="form-grupo">
                    <label for="login-email">Correo Electrónico:</label>
                    <input type="email" id="login-email" placeholder="tu@correo.com" required>
                </div>
                <div class="form-grupo">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" class="btn-primary">Ingresar a la Tienda</button>
            </form>

            <!-- Formulario de Registro de Usuario -->
            <form id="form-registro" class="auth-form oculto">
                <div class="form-grupo">
                    <label for="reg-nombre">Nombre Completo:</label>
                    <input type="text" id="reg-nombre" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="form-grupo">
                    <label for="reg-email">Correo Electrónico:</label>
                    <input type="email" id="reg-email" placeholder="tu@correo.com" required>
                </div>
                <div class="form-grupo">
                    <label for="reg-password">Contraseña:</label>
                    <input type="password" id="reg-password" placeholder="Crea una contraseña" required>
                </div>
                <button type="submit" class="btn-primary">Crear Cuenta</button>
            </form>

            <div id="auth-mensaje"></div>
        </div>
    </section>

    <!-- ==============================================
         PANTALLA PRINCIPAL DE LA TIENDA (Solo con sesión)
         ============================================== -->
    <main id="seccion-tienda" class="oculto">
        <!-- Catálogo de Productos -->
        <section class="productos">
            <h2>Productos Disponibles</h2>
            <div class="grid-productos">
                <div class="producto">
                    <h3>Producto A</h3>
                    <p>Precio: $10</p>
                    <button class="btn-agregar" data-id="1" data-nombre="Producto A" data-precio="10">Agregar al Carrito</button>
                </div>
                <div class="producto">
                    <h3>Producto B</h3>
                    <p>Precio: $20</p>
                    <button class="btn-agregar" data-id="2" data-nombre="Producto B" data-precio="20">Agregar al Carrito</button>
                </div>
                <div class="producto">
                    <h3>Producto C</h3>
                    <p>Precio: $30</p>
                    <button class="btn-agregar" data-id="3" data-nombre="Producto C" data-precio="30">Agregar al Carrito</button>
                </div>
            </div>
        </section>

        <!-- Carrito de Compras Personalizado -->
        <section class="carrito">
            <h2>Mi Carrito</h2>
            <div id="lista-carrito">
                <!-- Se renderizan los productos de este usuario -->
            </div>
            <div class="carrito-footer">
                <p>Total: $<span id="total-carrito">0</span></p>
                <button id="btn-vaciar">Vaciar Carrito</button>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
